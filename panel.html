<script>
// prefix section inject - add to settings page
document.addEventListener('DOMContentLoaded', () => {
  const settingsPage = document.getElementById('page-settings')
  if (!settingsPage) return
  const prefixCard = document.createElement('div')
  prefixCard.className = 'card'
  prefixCard.style.maxWidth = '480px'
  prefixCard.innerHTML = `
    <div class="card-header"><div class="card-title">Custom Prefix</div></div>
    <div class="card-body">
      <div class="form-label">Prefix</div>
      <div style="display:flex;gap:10px">
        <input class="form-input" id="prefix-input" placeholder="e.g. ! or . or ?" maxlength="5" style="max-width:120px">
        <button class="btn btn-primary" onclick="savePrefix()">Save</button>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:8px">Current: <span id="current-prefix">Loading...</span></div>
    </div>
  `
  settingsPage.appendChild(prefixCard)
  loadPrefix()
})

async function loadPrefix() {
  const cfg = await api('/config/default')
  const el = document.getElementById('current-prefix')
  if (el) el.textContent = cfg.prefix || '! (default)'
  const inp = document.getElementById('prefix-input')
  if (inp && cfg.prefix) inp.value = cfg.prefix
}

async function savePrefix() {
  const val = document.getElementById('prefix-input').value.trim()
  if (!val) return
  await api('/api/config', { method:'POST', body: JSON.stringify({ key:'prefix', val }) })
  document.getElementById('current-prefix').textContent = val
  toast(`Prefix set to "${val}"`)
}
</script>
